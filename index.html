<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuZiD LaYeRs — Coming Soon</title>
<link rel="stylesheet" href="fonts.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { font-family: 'C1st Font', serif; color: #fff; }

/* ── CUSTOM CURSOR (wie home.html) ── */
#cursor-dot {
  position: fixed; z-index: 9999; pointer-events: none;
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(0,229,255,0.9);
  box-shadow: 0 0 8px rgba(0,229,255,0.9), 0 0 20px rgba(0,229,255,0.4);
  transform: translate(-50%,-50%);
}
#cursor-ring {
  position: fixed; z-index: 9998; pointer-events: none;
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid rgba(0,229,255,0.35);
  transform: translate(-50%,-50%);
  transition: width .25s, height .25s, border-color .2s;
}
body.cursor-hover #cursor-ring { width: 50px; height: 50px; border-color: rgba(0,229,255,0.6); }

canvas#universe { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* Veil-Gradient über dem Sternenfeld */
#veil {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 42%,
              rgba(0,229,255,0.06) 0%, rgba(139,92,246,0.05) 35%, rgba(0,0,0,0.55) 100%);
}

/* ── INHALT ── */
#stage {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 40px 24px;
}
.brand {
  font-size: clamp(38px, 7vw, 88px);
  letter-spacing: 0.18em;
  text-shadow: 0 0 30px rgba(0,229,255,0.5), 0 0 80px rgba(0,229,255,0.2);
  animation: brand-breathe 4s ease-in-out infinite;
}
@keyframes brand-breathe {
  0%,100% { text-shadow: 0 0 30px rgba(0,229,255,0.4), 0 0 80px rgba(0,229,255,0.15); }
  50%      { text-shadow: 0 0 50px rgba(0,229,255,0.9), 0 0 120px rgba(139,92,246,0.35); }
}
.tagline {
  margin-top: 14px;
  font-size: clamp(10px, 1.6vw, 14px);
  letter-spacing: 0.55em; text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}
.divider {
  width: 72px; height: 1px; margin: 34px 0 30px;
  background: linear-gradient(90deg, transparent, rgba(0,229,255,0.8), rgba(139,92,246,0.8), transparent);
}
.soon {
  font-size: clamp(11px, 1.8vw, 15px);
  letter-spacing: 0.45em; text-transform: uppercase;
  color: #00E5FF;
  text-shadow: 0 0 14px rgba(0,229,255,0.6);
  animation: soon-pulse 3s ease-in-out infinite;
}
@keyframes soon-pulse {
  0%,100% { opacity: 0.65; } 50% { opacity: 1; }
}
.note {
  margin-top: 12px;
  font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
  color: rgba(255,255,255,0.32);
}

/* ── FOOTER (Impressum muss auch auf dem Platzhalter erreichbar sein) ── */
#foot {
  position: fixed; left: 0; right: 0; bottom: 22px; z-index: 10;
  display: flex; justify-content: center; gap: 28px;
  font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
}
#foot a {
  color: rgba(255,255,255,0.35); text-decoration: none;
  border-bottom: 1px solid rgba(0,229,255,0.15); padding-bottom: 2px;
  transition: color .2s, border-color .2s;
}
#foot a:hover { color: #00E5FF; border-color: rgba(0,229,255,0.6); }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<canvas id="universe"></canvas>
<div id="veil"></div>

<div id="stage">
  <div class="brand">LuZiD LaYeRs</div>
  <div class="tagline">Art · Technology · Vision</div>
  <div class="divider"></div>
  <div class="soon">Coming Soon</div>
  <div class="note">Seite im Aufbau</div>
</div>

<div id="foot">
  <a href="impressum.html">Impressum</a>
  <a href="datenschutz.html">Datenschutz</a>
</div>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<script>
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── Sternenfeld (Universe-Stil wie home.html, bewusst leichtgewichtig) ── */
const cv = document.getElementById('universe');
const cx = cv.getContext('2d');
let W, H, stars = [];
function resize() {
  W = cv.width = innerWidth * devicePixelRatio;
  H = cv.height = innerHeight * devicePixelRatio;
  stars = Array.from({length: 140}, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: (Math.random() * 1.3 + 0.3) * devicePixelRatio,
    a: Math.random() * 0.55 + 0.15,
    sp: Math.random() * 1.4 + 0.4,
    ph: Math.random() * Math.PI * 2,
    violet: Math.random() < 0.18
  }));
}
addEventListener('resize', resize); resize();

function draw(t) {
  cx.clearRect(0, 0, W, H);
  for (const s of stars) {
    const tw = REDUCED_MOTION ? 1 : (Math.sin(t / 1000 * s.sp + s.ph) * 0.5 + 0.5);
    cx.beginPath();
    cx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    cx.fillStyle = s.violet
      ? `rgba(139,92,246,${s.a * tw})`
      : `rgba(200,240,255,${s.a * tw})`;
    cx.fill();
  }
  if (!REDUCED_MOTION) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ── Custom Cursor (wie home.html) ── */
const dot = document.getElementById('cursor-dot');
const ring = document.getElementById('cursor-ring');
let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my;
addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  dot.style.left = mx + 'px'; dot.style.top = my + 'px';
});
(function ringLoop() {
  rx += (mx - rx) * 0.16; ry += (my - ry) * 0.16;
  ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  requestAnimationFrame(ringLoop);
})();
document.querySelectorAll('a').forEach(a => {
  a.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
  a.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
});
</script>
</body>
</html>
