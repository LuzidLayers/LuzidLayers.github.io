<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marietta's Laden — L.U.Z. Studio</title>
<link rel="stylesheet" href="../fonts.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { font-family: 'C1st Font', serif; color: #fff; }

#cursor-dot { position: fixed; z-index: 9999; pointer-events: none; width: 8px; height: 8px; border-radius: 50%;
  background: rgba(0,229,255,0.9); box-shadow: 0 0 8px rgba(0,229,255,.9), 0 0 20px rgba(0,229,255,.4);
  transform: translate(-50%,-50%); transition: width .15s,height .15s,box-shadow .2s; }
#cursor-ring { position: fixed; z-index: 9998; pointer-events: none; width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid rgba(0,229,255,.35); transform: translate(-50%,-50%); transition: width .25s,height .25s,border-color .2s; }
body.ch #cursor-dot { width: 12px; height: 12px; box-shadow: 0 0 16px rgba(0,229,255,1), 0 0 40px rgba(0,229,255,.6); }
body.ch #cursor-ring { width: 50px; height: 50px; border-color: rgba(0,229,255,.6); }

canvas#universe { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#veil { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 40%, rgba(0,229,255,.05) 0%, rgba(139,92,246,.05) 35%, rgba(0,0,0,.6) 100%); }

#nav { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between;
  padding: 26px 40px; }
.nav-logo { font-size: 15px; letter-spacing: .17em; color: rgba(255,255,255,.85); text-shadow: 0 0 20px rgba(0,229,255,.3); }
.nav-hint { font-size: 9px; letter-spacing: .4em; text-transform: uppercase; color: rgba(255,255,255,.22); }

#stage { position: fixed; top: 12%; left: 0; right: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
  text-align: center; padding: 0 24px; }
.brand { font-size: clamp(26px, 4.4vw, 46px); letter-spacing: .1em;
  text-shadow: 0 0 30px rgba(0,229,255,.5), 0 0 80px rgba(0,229,255,.2); animation: brand-breathe 4s ease-in-out infinite; }
@keyframes brand-breathe { 0%,100%{text-shadow:0 0 30px rgba(0,229,255,.4),0 0 80px rgba(0,229,255,.15)} 50%{text-shadow:0 0 50px rgba(0,229,255,.9),0 0 120px rgba(139,92,246,.35)} }
.tagline { margin-top: 12px; font-size: clamp(9px,1.3vw,12px); letter-spacing: .5em; text-transform: uppercase; color: rgba(255,255,255,.5); }
.prompt { margin-top: 30px; font-size: clamp(10px,1.4vw,13px); letter-spacing: .35em; text-transform: uppercase;
  color: rgba(255,255,255,.35); animation: prompt-pulse 2.6s ease-in-out infinite; }
@keyframes prompt-pulse { 0%,100%{opacity:.4} 50%{opacity:.9} }

#star-nav { position: fixed; inset: 0; z-index: 20; }
.dest { position: absolute; transform: translate(-50%,-50%); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
.dest-dot { position: relative; width: 11px; height: 11px; border-radius: 50%; background: var(--dc);
  box-shadow: 0 0 12px var(--dc), 0 0 30px color-mix(in srgb, var(--dc) 40%, transparent);
  animation: dest-pulse 3s ease-in-out infinite; animation-delay: var(--delay,0s); transition: transform .3s, box-shadow .3s; }
@keyframes dest-pulse { 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.5);opacity:1} }
.dest:hover .dest-dot { transform: scale(2.2); box-shadow: 0 0 20px var(--dc), 0 0 60px color-mix(in srgb, var(--dc) 60%, transparent); }
.dest-dot::before { content:''; position:absolute; inset:-12px; border-radius:50%;
  border:1px solid color-mix(in srgb, var(--dc) 30%, transparent); animation: dest-ring 3s ease-in-out infinite; animation-delay: var(--delay,0s); }
@keyframes dest-ring { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.8);opacity:0} }
.dest-label { display:flex; flex-direction:column; align-items:center; gap:5px; opacity:.55; transition:opacity .3s; }
.dest:hover .dest-label { opacity: 1; }
.dest-name { font-size: clamp(13px,1.7vw,17px); letter-spacing:.2em; text-transform:uppercase; color:#fff;
  text-shadow: 0 0 20px var(--dc); transition: text-shadow .3s, letter-spacing .3s; }
.dest:hover .dest-name { text-shadow: 0 0 10px #fff, 0 0 30px var(--dc), 0 0 60px var(--dc); letter-spacing: .27em; }
.dest-sub { font-size: 9.5px; letter-spacing: .3em; text-transform: uppercase; color: rgba(255,255,255,.4); transition: color .3s; }
.dest:hover .dest-sub { color: rgba(255,255,255,.75); }

#hud { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; flex-direction: column; align-items: center;
  padding-bottom: 30px; gap: 8px; }
.hud-status { font-size: 9px; letter-spacing: .45em; text-transform: uppercase; color: rgba(255,255,255,.2); }

@media (max-width: 720px) {
  #stage{top:9%}
  .dest-sub{display:none}
}
@media (prefers-reduced-motion: reduce) { *,*::before,*::after{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<canvas id="universe"></canvas>
<div id="veil"></div>

<nav id="nav">
  <span class="nav-logo">L.U.Z. Studio</span>
  <span class="nav-hint">Wähle einen Stern</span>
</nav>

<div id="stage">
  <div class="brand">Marietta&rsquo;s Laden</div>
  <div class="tagline">Marke · Website · Angebot — an einem Ort</div>
  <div class="prompt">Wähle einen Stern, um weiterzureisen</div>
</div>

<div id="star-nav">
  <a class="dest" href="website.html" style="top:38%; left:26%; --dc:#39FF7A; --delay:0s;">
    <div class="dest-dot"></div>
    <div class="dest-label"><span class="dest-name">Website</span><span class="dest-sub">Vorschau &amp; Redaktion</span></div>
  </a>
  <a class="dest" href="corporate-identity.html" style="top:40%; left:76%; --dc:#FFD700; --delay:.5s;">
    <div class="dest-dot"></div>
    <div class="dest-label"><span class="dest-name">Corporate Identity</span><span class="dest-sub">Marke &amp; Design</span></div>
  </a>
  <a class="dest" href="fahrplan.html" style="top:56%; left:70%; --dc:#00E5FF; --delay:1s;">
    <div class="dest-dot"></div>
    <div class="dest-label"><span class="dest-name">Fahrplan</span><span class="dest-sub">Ablauf &amp; Phasen</span></div>
  </a>
  <a class="dest" href="preisliste.html" style="top:68%; left:34%; --dc:#8B5CF6; --delay:1.5s;">
    <div class="dest-dot"></div>
    <div class="dest-label"><span class="dest-name">Preisliste</span><span class="dest-sub">Leistungen &amp; Pakete</span></div>
  </a>
</div>

<div id="hud"><div class="hud-status" id="hud-status">Bereit</div></div>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<script>
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = document.getElementById('universe'), cx = cv.getContext('2d');
let W,H,stars=[];
function resize(){
  W = cv.width = innerWidth * devicePixelRatio;
  H = cv.height = innerHeight * devicePixelRatio;
  stars = Array.from({length:150}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: (Math.random()*1.3+.3)*devicePixelRatio,
    a: Math.random()*.55+.15, sp: Math.random()*1.4+.4, ph: Math.random()*Math.PI*2,
    violet: Math.random()<.18
  }));
}
addEventListener('resize', resize); resize();
function draw(t){
  cx.clearRect(0,0,W,H);
  for(const s of stars){
    const tw = REDUCED_MOTION ? 1 : (Math.sin(t/1000*s.sp+s.ph)*.5+.5);
    cx.beginPath(); cx.arc(s.x,s.y,s.r,0,Math.PI*2);
    cx.fillStyle = s.violet ? `rgba(139,92,246,${s.a*tw})` : `rgba(200,240,255,${s.a*tw})`;
    cx.fill();
  }
  if(!REDUCED_MOTION) requestAnimationFrame(draw); else return;
}
requestAnimationFrame(draw);

if(!matchMedia('(pointer: coarse)').matches){
  const dot=document.getElementById('cursor-dot'), ring=document.getElementById('cursor-ring');
  addEventListener('mousemove', e=>{
    dot.style.left=ring.style.left=e.clientX+'px';
    dot.style.top=ring.style.top=e.clientY+'px';
  });
  document.querySelectorAll('.dest').forEach(d=>{
    d.addEventListener('mouseenter', ()=>document.body.classList.add('ch'));
    d.addEventListener('mouseleave', ()=>document.body.classList.remove('ch'));
  });
} else { document.body.style.cursor='auto'; document.querySelectorAll('*').forEach(el=>el.style.cursor=''); }
</script>
</body>
</html>
